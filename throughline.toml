[project]
name = "Audience — General reader (throughline source)"
format_version = 2

# A throughline *source*: a standalone graph a consuming project composes via
# throughline-compose, importing it under a namespace (e.g. `audience`) and referencing
# principles as `audience:UR-0001` or rules as `audience:SR-0001`. The UIDs here are
# this source's own and immutable; the audience + dimension reference lives in
# `attrs.source_ref`, never in the UID.
#
# This is the *audience* axis — how the writing is CALIBRATED to the reader's expertise
# (assumed knowledge, terminology, depth, orientation, examples) — for ONE level: a
# GENERAL (lay) reader with no special knowledge of the field. It deliberately says
# nothing about universal readability, spelling, punctuation, tone/register, purpose,
# medium or brand voice; each of those is its own throughline source. Audience levels
# are MUTUALLY EXCLUSIVE: expert, practitioner and general are SIBLING sources and a
# consumer composes exactly one under the `audience` namespace (swapping level is a
# one-line `url`/`ref` change). Mixing levels would merge rules that assume different
# reader knowledge, so they are never combined.
#
# Note the deliberate tension with the readability axis (`throughline-plain-language`):
# plain language is UNIVERSAL clarity for any reader, whereas this axis tunes how much
# the writer may ASSUME and how much domain vocabulary is acceptable for a specific
# reader. They are independent and a consumer composes both.
#
# The rules are Time Back Solutions' own house content guidance, licensed under
# Apache-2.0; nothing here reproduces a third-party standard. Each principle is a
# `user_requirement`; each concrete rule is a `system_requirement` that `implements`
# its principle.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

[types.user_requirement]
attrs.source_ref = { required = true }

[types.system_requirement]
attrs.source_ref = { required = true }

[links]
types = ["derives_from", "implements", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
proposed    = ["draft", "approved", "ratified", "deferred", "rejected", "deleted"]
draft       = ["approved", "deferred", "rejected", "deleted"]
deferred    = ["draft", "approved", "rejected", "deleted"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

# `tl docs` regenerates docs/spec.md + README.md from the graph; `tl docs --check`
# gates them so the published counts and tables can never drift.
[docs]
paths = ["docs/*.md", "README.md"]
